[workspace]
members = [".", "crates/bridgeforge-core", "crates/bridgeforge-cli"]
default-members = [".", "crates/bridgeforge-cli"]
resolver = "3"

[workspace.package]
version = "1.12.2"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2"

[package]
name = "bridgeforge-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bridgeforge_factory_tests)'] }

[dependencies]
bridgeforge-core = { path = "crates/bridgeforge-core" }
chrono.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
walkdir.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
