[workspace]
members = ["source/core", "source/skeleton", "source/checks", "source/workflow", "source/lifecycle", "source/memory", "source/cli", "source/hook"]
resolver = "3"

[workspace.package]
version = "9.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.metadata.bridgeforge]
public-members = ["source/core", "source/skeleton", "source/checks", "source/workflow", "source/lifecycle", "source/memory", "source/cli", "source/hook"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2"

bridgeforge-core = { path = "source/core" }
bridgeforge-skeleton = { path = "source/skeleton" }
bridgeforge-checks = { path = "source/checks" }
bridgeforge-workflow = { path = "source/workflow" }
bridgeforge-lifecycle = { path = "source/lifecycle" }
bridgeforge-memory = { path = "source/memory" }
bridgeforge-cli = { path = "source/cli" }
bridgeforge-hook = { path = "source/hook" }
toml_edit = "=0.23.7"
pep440_rs = "=0.7.3"
pep508_rs = "=0.9.2"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
